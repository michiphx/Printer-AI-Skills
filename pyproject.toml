[project]
name = "printer-ai-skills"
version = "1.1.0"
description = "Cross-platform local printer CLI for AI agents: discover, diagnose, set up and print"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.10"
dependencies = [
    'pycups>=2.0.4; sys_platform == "darwin" or sys_platform == "linux"',
    "pywin32>=311; sys_platform == 'win32'",
]

[project.urls]
Homepage = "https://github.com/michiphx/Printer-AI-Skills"
Repository = "https://github.com/michiphx/Printer-AI-Skills"

[project.scripts]
printer-ai = "main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["local_printer", "models", "utils"]

[tool.hatch.build.targets.wheel.force-include]
"main.py" = "main.py"
