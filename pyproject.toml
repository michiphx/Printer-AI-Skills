[project]
name = "printer-ai-skills"
version = "1.2.0"
description = "Cross-platform local printer CLI for AI agents: discover, diagnose, set up and print any file"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.10"
dependencies = [
    'pycups>=2.0.4; sys_platform == "darwin" or sys_platform == "linux"',
    "pywin32>=311; sys_platform == 'win32'",
    # Universal "convert to PDF" layer (all platforms)
    "Pillow>=10.0",        # images -> PDF; also the DIB bridge for GDI printing on Windows
    "reportlab>=4.0",      # plain text / code -> PDF (pure Python)
    "markdown>=3.5",       # Markdown -> HTML (then HTML -> PDF via a browser or LibreOffice)
    # Driver-based printing on Windows: rasterise PDF pages and hand them to the printer driver
    "pypdfium2>=4.0; sys_platform == 'win32'",
]

[project.urls]
Homepage = "https://github.com/michiphx/Printer-AI-Skills"
Repository = "https://github.com/michiphx/Printer-AI-Skills"

[project.scripts]
printer-ai = "main:main"

[dependency-groups]
dev = ["pytest>=8"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["local_printer", "models", "utils"]

[tool.hatch.build.targets.wheel.force-include]
"main.py" = "main.py"
